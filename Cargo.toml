[workspace]
resolver = "3"
members = ["crates/formats", "crates/sim", "crates/client"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/skitoo/OpenStrike"

[workspace.dependencies]
openstrike-formats = { path = "crates/formats" }
openstrike-sim = { path = "crates/sim" }
flate2 = "1.1"
thiserror = "2.0"
raylib = "6.0"
